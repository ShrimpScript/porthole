<!doctype html>

<style>

</style>
<div class="frame">
  <div class="sea"></div>

  <h1>Your agents work<br>below deck.</h1>

  <!-- the person on deck: the leader stops just above the phone in their hand (map: Screen 297, 583) -->

  <div class="lead v" style="left: 297px; top: 290px; height: 268px;"></div>
  <div class="dot" style="left: 297.5px; top: 561px;"></div>

  <!-- the speaking tube's mouth on deck (map: 444, 577) -->
  <p class="call" style="left: 456px; width: 320px; top: 290px;"><b>Your Tailscale network</b>Encrypted end to end.<br>No Porthole server in between.</p>
  <div class="lead v" style="left: 444px; top: 290px; height: 284px;"></div>
  <div class="dot" style="left: 444.5px; top: 577px;"></div>

  <!-- the middle engine (map: 731, 861): the leader runs down through the hull into the sea -->

  <div class="lead v" style="left: 731px; top: 866px; height: 138px;"></div>
  <p class="call left" style="left: 250px; width: 469px; top: 990px;"><b>Your computer</b>Claude Code runs here, in tmux.<br>Two sessions working, one waiting on you.</p>

  <footer>
    <span class="brand">P<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.95"/></svg>rthole</span>
