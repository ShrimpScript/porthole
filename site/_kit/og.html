<!doctype html>
<!--
  The Open Graph image (site/og.png, 1200x630), composed from the device kit. Not deployed
  (_kit/ is in .vercelignore). Regenerate after a kit change, with a local server on the
  site directory:

    python3 -m http.server 8777 --bind 127.0.0.1 -d site &
    google-chrome-stable --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=4000 --screenshot=site/og.png http://127.0.0.1:8777/_kit/og.html
    kill %1

  ?step=N picks another step of the question scene (default 1: the question on both sides).
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Porthole og image</title>
<link rel="preload" href="/assets/fonts/hanken-grotesk-bold-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/kit.css">
<script src="../assets/kit.js" defer></script>
<script src="../assets/kit-more.js" defer></script>
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--ground); }
  .t { position: absolute; left: 72px; top: 0; bottom: 0; width: 420px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .wm { display: flex; align-items: baseline; font: 700 88px/1 var(--sans); letter-spacing: -.035em; color: var(--text); }
  .wm.brand { padding: 0; --rim-1: #FFFFFF; --rim-2: #ECECEF; --rim-3: #C9C9CF; --bolt: #0B0B0C; }
  .say { font: 600 38px/1.14 var(--sans); letter-spacing: -.02em; color: var(--text); text-wrap: balance; margin: 0; }
  .sub { font: 400 22px/1.4 var(--sans); color: var(--muted); margin: 0; max-width: 20em; }
  .comp { position: absolute; left: 520px; top: 58px; width: 560px; }
  .ph { position: absolute; left: 948px; top: 92px; width: 232px; }
  /* The window's own shadow is in the kit; the phone overlaps the window's right edge. */
</style>
</head>
<body>
  <div class="t">
    <div class="wm brand">P<span class="brand-o"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="rpwog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--rim-1)"/><stop offset=".5" style="stop-color:var(--rim-2)"/><stop offset="1" style="stop-color:var(--rim-3)"/></linearGradient><radialGradient id="vpwog" cx="50%" cy="18%" r="78%"><stop offset="0" stop-color="#3a4049"/><stop offset=".5" stop-color="#1d2127"/><stop offset="1" stop-color="#0d0f12"/></radialGradient><clipPath id="cpwog"><circle cx="50" cy="50" r="32"/></clipPath></defs><circle cx="50" cy="50" r="47" fill="url(#rpwog)"/><circle class="bt" cx="86.96" cy="65.31" r="2.6"/><circle class="bt" cx="65.31" cy="86.96" r="2.6"/><circle class="bt" cx="34.69" cy="86.96" r="2.6"/><circle class="bt" cx="13.04" cy="65.31" r="2.6"/><circle class="bt" cx="13.04" cy="34.69" r="2.6"/><circle class="bt" cx="34.69" cy="13.04" r="2.6"/><circle class="bt" cx="65.31" cy="13.04" r="2.6"/><circle class="bt" cx="86.96" cy="34.69" r="2.6"/><circle cx="50" cy="50" r="33.6" fill="#050506"/><g clip-path="url(#cpwog)"><rect width="100" height="100" fill="url(#vpwog)"/><g transform="rotate(-42 50 50)" fill="#fff"><rect x="16" y="22" width="68" height="9" opacity=".55"/><rect x="16" y="35" width="68" height="3.4" opacity=".385"/></g></g><circle cx="50" cy="50" r="32" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.4"/></svg></span>rthole</div>
    <p class="say">Run Claude Code on your computer, from your phone.</p>
    <p class="sub">An Android app and a small daemon for your Mac or Linux computer, over your own Tailscale network.</p>
  </div>
  <div class="comp"></div>
  <div class="ph"></div>
<script>
addEventListener('load', () => document.fonts.ready.then(() => {
  const steps = PK.scenes.question.steps;
  const k = Math.min(steps.length - 1, +(new URLSearchParams(location.search).get('step') ?? 1));
  const OWN = { cap: 1, ms: 1, seq: 1, tap: 1 };
  const take = (s, st) => { for (const x in st) if (!OWN[x]) s[x] = st[x]; return s; };
  const s = {};
  for (let x = 0; x <= k; x++) { take(s, steps[x]); (steps[x].seq || []).forEach(q => take(s, q[1])); }
  PK.computer(document.querySelector('.comp')).render(s, false);
  PK.phone(document.querySelector('.ph')).render(s, false);
  document.body.classList.add('pk-still');
}));
</script>
</body>
</html>
