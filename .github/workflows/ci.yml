name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -q && sudo apt-get install -yq tmux; fi
      - name: vet
        working-directory: daemon
        run: go vet ./...
      - name: test
        working-directory: daemon
        run: go test ./...
      - name: capture, sshd, new sessions and the terminal on a real Mac
        if: runner.os == 'macOS'
        working-directory: daemon
        run: go test -count=1 -v -run 'TestMacCapture|TestRealSSHD|TestNewSession|TestPhoneAlone|TestFolderAccess|TestTrustPrompt|TestFiles|TestAttach|TestUpload|TestOldApps|TestTidy' ./internal/server/ ./internal/sshkeys/ ./internal/termbridge/
      - name: build for every release target
        working-directory: daemon
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/portholed
          done; done
      - name: smoke test on this OS
        run: ./tools/ci-smoke.sh
      - name: the Homebrew formula installs, passes its test and survives upgrades
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -eu
          REL="$RUNNER_TEMP/rel"; mkdir -p "$REL"
          for os in linux darwin; do for arch in amd64 arm64; do
            env -C daemon CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$REL/portholed-$os-$arch" ./cmd/portholed
          done; done
          (cd "$REL" && shasum -a 256 portholed-* > SHA256SUMS)
          V=$(grep -oE 'Version = "[0-9.]+"' daemon/internal/server/server.go | grep -oE '[0-9.]+')
          brew tap-new --no-git porthole/ci
          PORTHOLE_FORMULA_BASE="file://$REL" ./tools/homebrew-formula.sh "$V" "$REL/SHA256SUMS" \
            > "$(brew --repository porthole/ci)/Formula/porthole.rb"
          brew install porthole/ci/porthole
          brew test porthole/ci/porthole
          P=$(brew --prefix)
          "$P/bin/portholed" version
          [ "$(readlink "$P/bin/porthole")" != "" ]
          # The service must point at opt/, which follows upgrades, never at the versioned keg.
          "$P/bin/portholed" service install || true
          PLIST="$HOME/Library/LaunchAgents/dev.shrimpscript.portholed.plist"
          grep -A2 ProgramArguments "$PLIST"
          grep -q "$P/opt/porthole/bin/portholed" "$PLIST"
          ! grep -q Cellar "$PLIST"
          "$P/bin/portholed" service uninstall
          brew uninstall porthole/ci/porthole
